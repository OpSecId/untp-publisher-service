# Require Developer Certificate of Origin (Signed-off-by) on every commit in a PR.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing Signed-off-by (DCO). Use: git commit -s"
              git show -s --oneline "$sha"
              missing=1
            fi
          done
          exit "$missing"
